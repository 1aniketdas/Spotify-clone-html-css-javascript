<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="stylesheet" href="css/style.css">

            <div class="home bg-gray rounded m-1 p-1">

                    <img class="invert main_logo" src="img/logo.svg" alt="">

                </div>
                <ul>
                    <li><img class="invert" src="img/homelogo.svg" alt="">Home</li>
                    <li><img class="invert" src="img/searchlogo.svg" alt="">Search</li>
                </ul>
            </div>

            <!-- <div class="library bg-gray rounded p-1"> -->
            <div class="library bg-gray rounded m-1 p-1">
                <div class="heading">
                    <img class="invert" src="img/playlist.svg" alt="">

                </div>
                <div class="songlist m-1 p-1">

                    </ul>
                </div>

                    <div><a href=""><span>About Ads</span></a></div>
                    <div><a href=""><span>Accessibilty</span></a></div>
                </div>
            </div>


            

        </div>











        <div class="right bg-black">
            <div class="header rounded bg-gray p-1 m-1">

                    <img class="invert menu" src="img/menu-svgrepo-com.svg" alt="">
                    <!-- <img class="invert" src="img/leftarrow.svg">
                    <img class="invert" src="img/rightarrow.svg"> -->
                </div>
                <div class="buttons">
                    <button class="signbtn">Sign Up</button>
                    <button class="loginbtn">Log In</button>
                </div>
            </div>




            <div class="spotplaylist rounded bg-gray p-1 m-1">
            <!-- <div class="spotplaylist" > -->
                <h2>Playlist</h2>
                <div class="card-container">

                        <p>Artist Name</p>

                </div>
                <div class="playbar">
                    <div class="seekbar">
                        <div class="circle_progress"></div>
                    </div>
                    <div class="aboveseekbar">
                        <div class="songinfo">
                            <div class="playbar-scroll">
                                <span></span>
                            </div>
                        </div>
                        <div class="songbtns">
                            <img id="previous" class="invert" src="img/previous-svgrepo-com.svg">
                            <img id="play" class="invert" src="img/play-svgrepo-com.svg">
                            <img id="next" class="invert" src="img/next-svgrepo-com.svg">
                        </div>
                        <div class="volumeandsongtime">
                            <div class="songtime"></div>
                            <div class="volume">
